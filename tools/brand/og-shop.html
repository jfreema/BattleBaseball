<!doctype html>
<!-- Battle Shop's link preview image, web/og-shop.png. Rendered at 1200 by
     630 by tools/brand/render.mjs. The shirts are the shop's sample photos,
     each on paper as the shop shows them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("../../assets/fonts/lilita_one/LilitaOne-Regular.ttf"); }
@font-face { font-family: "Black Ops One"; src: url("../../assets/fonts/black_ops_one/BlackOpsOne-Regular.ttf"); }

:root {
  --field: #1f4fc4; --cream: #f5efdf; --kraft: #e4dbc3; --ink: #0f1a3a; --coral: #ffc627;
  --display: "Lilita One", sans-serif; --stencil: "Black Ops One", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--field); color: var(--cream); -webkit-font-smoothing: antialiased; }
h1 { margin: 0; }

.brand { position: absolute; left: 72px; top: 54px; display: flex; flex-direction: column; line-height: 1; }
.brand b { font: 400 34px/0.9 var(--display); letter-spacing: 0.035em; text-shadow: 0 3px 0 var(--ink); }
.brand i { font: 400 16.3px/1 var(--stencil); font-style: normal; letter-spacing: 0.115em; color: var(--coral); margin-top: 6px; }

h1 { position: absolute; left: 72px; top: 236px; font: 400 96px/1 var(--display); letter-spacing: 0.005em; text-shadow: 0 6px 0 var(--ink); white-space: nowrap; }
h1 .l { display: block; }
.slab {
  display: inline-block; margin: 0.1em 0 0.2em -0.06em; padding: 0 0.2em 0.06em;
  background: var(--coral); color: var(--ink); text-shadow: none;
  border: 4px solid var(--ink); border-radius: 0.24em; box-shadow: 0 7px 0 var(--ink);
  transform: rotate(-2.5deg);
}

/* A shirt on paper: the shop's product card without its words. */
.shirt {
  position: absolute; width: 372px; padding: 12px;
  background: var(--cream); border: 3.5px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink);
}
.shirt img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; }
.shirt.back { left: 680px; top: 74px; background: var(--kraft); transform: rotate(-6deg); }
.shirt.front { left: 778px; top: 132px; transform: rotate(4deg); }
</style>
</head>
<body>
<div class="brand"><b>BATTLE</b><i>SHOP</i></div>

<h1><span class="l">Shirts and</span><span class="slab">team gear.</span></h1>

<div class="shirt back"><img src="../../assets/merch/sample-true-royal.jpg" alt=""></div>
<div class="shirt front"><img src="../../assets/merch/sample-coral.jpg" alt=""></div>
</body>
</html>
