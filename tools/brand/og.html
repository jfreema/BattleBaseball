<!doctype html>
<!-- The link preview image, web/og.png. Rendered at 1200 by 630 by
     tools/brand/render.mjs. The card is the sample card from Home. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Lilita One"; src: url("../../assets/fonts/lilita_one/LilitaOne-Regular.ttf"); }
@font-face { font-family: "Black Ops One"; src: url("../../assets/fonts/black_ops_one/BlackOpsOne-Regular.ttf"); }
@font-face { font-family: "Fredoka"; font-weight: 600; src: url("../../assets/fonts/fredoka/Fredoka-SemiBold.ttf"); }
@font-face { font-family: "Fredoka"; font-weight: 700; src: url("../../assets/fonts/fredoka/Fredoka-Bold.ttf"); }

:root {
  --field: #1f4fc4; --cream: #f5efdf; --kraft: #e4dbc3; --ink: #0f1a3a; --ink2: #4f5873;
  --coral: #ffc627; --coral-art: #f0b30c; --coral-d: #c0262f; --lemon: #f26a4b;
  --display: "Lilita One", sans-serif; --stencil: "Black Ops One", sans-serif; --label: "Fredoka", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--field); color: var(--cream); -webkit-font-smoothing: antialiased; }
h1, h2, p { margin: 0; }

.brand { position: absolute; left: 72px; top: 54px; display: flex; flex-direction: column; line-height: 1; }
.brand b { font: 400 34px/0.9 var(--display); letter-spacing: 0.035em; text-shadow: 0 3px 0 var(--ink); }
.brand i { font: 400 16.3px/1 var(--stencil); font-style: normal; letter-spacing: 0.115em; color: var(--coral); margin-top: 6px; }

h1 { position: absolute; left: 72px; top: 206px; font: 400 86px/1 var(--display); letter-spacing: 0.005em; text-shadow: 0 6px 0 var(--ink); white-space: nowrap; }
h1 .l { display: block; }
.slab {
  display: inline-block; margin: 0.1em 0 0.2em -0.06em; padding: 0 0.2em 0.06em;
  background: var(--coral); color: var(--ink); text-shadow: none;
  border: 4px solid var(--ink); border-radius: 0.24em; box-shadow: 0 7px 0 var(--ink);
  transform: rotate(-2.5deg);
}

.hero-card { position: absolute; left: 742px; top: 62px; }
.peek {
  position: absolute; top: 4px; left: 0; width: 380px; height: 509px;
  background: var(--kraft); border: 3.5px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink);
  transform: rotate(-5deg) translate(-20px, 6px);
}

/* The card front, in twentieths of its width. */
.pcard {
  --w: 380px;
  position: relative; width: var(--w); font-size: calc(var(--w) / 20);
  padding: 0.55em; background: var(--cream); color: var(--ink);
  border: 0.16em solid var(--ink); border-radius: 1.15em; box-shadow: 0 0.36em 0 var(--ink);
  transform: rotate(4deg);
}
.pcard-win { position: relative; height: 17.4em; overflow: hidden; background: var(--coral); border: 0.14em solid var(--ink); border-radius: 0.68em; }
.pcard-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.pcard-art .tone { fill: var(--coral-art); }
.pcard-art .seam { fill: none; stroke: var(--coral-d); stroke-width: 2.5; stroke-linecap: round; }
.pcard-art .stitch { fill: none; stroke: var(--coral-d); stroke-width: 13; stroke-dasharray: 2.5 9; }
.pcard-maker { position: absolute; left: 0.85em; top: 0.8em; display: flex; flex-direction: column; line-height: 1; }
.pcard-maker b { font: 400 1em/0.9 var(--display); letter-spacing: 0.035em; }
.pcard-maker i { font: 400 0.5em/1 var(--stencil); font-style: normal; letter-spacing: 0.1em; margin-top: 0.3em; }
.pcard-num { position: absolute; right: 0.7em; top: 0.7em; width: 3.5em; height: 3.5em; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--cream); }
.pcard-num::before { content: ""; position: absolute; inset: 0.24em; border-radius: 50%; border: 0.075em dashed rgba(245, 239, 223, 0.8); }
.pcard-num span { font: 400 1.7em/1 var(--display); }
.pcard-velo { position: absolute; left: 0.8em; bottom: 2.05em; display: flex; align-items: flex-end; gap: 0.5em; }
.pcard-velo .v { font: 400 10.4em/0.76 var(--display); letter-spacing: -0.012em; color: var(--cream); -webkit-text-stroke: 0.036em var(--ink); paint-order: stroke fill; text-shadow: 0 0.05em 0 var(--ink); }
.pcard-velo .u { font: 400 2em/1 var(--display); padding-bottom: 0.08em; }
.pcard-velo-label { position: absolute; left: 1em; bottom: 0.78em; font: 700 0.68em/1 var(--label); letter-spacing: 0.13em; text-transform: uppercase; }
.pcard-id { padding: 0.62em 0.55em 0; }
.pcard-name { font: 400 2.35em/1 var(--display); letter-spacing: 0.005em; }
.pcard-pos { margin-top: 0.5em; display: flex; align-items: center; gap: 0.45em; font: 700 0.74em/1 var(--label); letter-spacing: 0.09em; text-transform: uppercase; }
.pcard-pos b { background: var(--ink); color: var(--cream); padding: 0.3em 0.5em 0.26em; border-radius: 0.38em; }
.pcard-foot { margin: 0.75em 0.55em 0; padding: 0.55em 0 0.3em; border-top: 0.1em solid var(--ink); display: flex; justify-content: space-between; gap: 0.5em; white-space: nowrap; font: 600 0.62em/1 var(--label); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink2); }
.pcard-foot b { font-weight: 700; color: var(--ink); }
.seals { position: absolute; right: 0.5em; bottom: 2.9em; display: flex; }
.seal { position: relative; width: 4.6em; height: 4.6em; display: grid; place-items: center; text-align: center; }
.seal svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.seal .drop { fill: var(--ink); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
.seal .foil { fill: var(--lemon); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
.seal span { position: relative; font: 700 0.6em/1.02 var(--label); letter-spacing: 0.04em; text-transform: uppercase; }
.seal .big { font: 400 1.4em/1 var(--display); letter-spacing: 0.02em; }
.seals .seal:nth-child(1) { transform: rotate(9deg); }
.seals .seal:nth-child(2) { transform: rotate(-11deg); margin-left: -1.5em; margin-top: -1.35em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-seal" viewBox="0 0 100 100"><polygon points="50,3 58.1,9.3 68,6.6 73.1,15.5 83.2,16.8 84.5,26.9 93.4,32 90.7,41.9 97,50 90.7,58.1 93.4,68 84.5,73.1 83.2,83.2 73.1,84.5 68,93.4 58.1,90.7 50,97 41.9,90.7 32,93.4 26.9,84.5 16.8,83.2 15.5,73.1 6.6,68 9.3,58.1 3,50 9.3,41.9 6.6,32 15.5,26.9 16.8,16.8 26.9,15.5 32,6.6 41.9,9.3"/></symbol>
  </defs>
</svg>

<div class="brand"><b>BATTLE</b><i>BASEBALL</i></div>

<h1><span class="l">Play the</span><span class="slab">Showcase.</span><span class="l">Earn your card.</span></h1>

<div class="hero-card">
  <div class="peek"></div>
  <div class="pcard">
    <div class="pcard-win">
      <svg class="pcard-art" viewBox="0 0 293 274" preserveAspectRatio="xMaxYMax slice">
        <circle class="tone" cx="318" cy="262" r="128"/>
        <path class="seam" d="M293.6 133.5A95 95 0 0 1 191.7 244.6"/>
        <path class="stitch" d="M293.6 133.5A95 95 0 0 1 191.7 244.6"/>
      </svg>
      <div class="pcard-maker"><b>BATTLE</b><i>BASEBALL</i></div>
      <div class="pcard-num"><span>12</span></div>
      <div class="pcard-velo"><span class="v">71</span><span class="u">MPH</span></div>
      <div class="pcard-velo-label">Top fastball</div>
    </div>
    <div class="pcard-id">
      <h2 class="pcard-name">Mason R.</h2>
      <p class="pcard-pos"><b>RHP</b><b>SS</b></p>
    </div>
    <div class="pcard-foot"><span>Class of <b>2031</b></span><span>Bats <b>R</b></span><span>Throws <b>R</b></span><span>Louisiana</span></div>
    <div class="seals">
      <div class="seal"><svg><use class="drop" href="#i-seal" y="7"/><use class="foil" href="#i-seal"/></svg><span>Top<br>Pitcher</span></div>
      <div class="seal"><svg><use class="drop" href="#i-seal" y="7"/><use class="foil" href="#i-seal"/></svg><span class="big">MVP</span></div>
    </div>
  </div>
</div>
</body>
</html>
