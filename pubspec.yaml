name: battle_baseball
description: "Battle Baseball: youth baseball player showcases."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  material_ui: ^1.1.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  go_router: ^18.1.4
  url_launcher: ^6.3.3
  intl: ^0.20.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # BattlePlan's Open Field fonts, bundled so text looks the same everywhere
  # and nothing loads from Google Fonts: Lilita One titles, Black Ops One
  # stencil eyebrows, Fredoka labels and buttons, Nunito body text. Each is
  # SIL OFL 1.1; the licenses ship beside them.
  assets:
    - assets/merch/
    - assets/fonts/lilita_one/OFL.txt
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/black_ops_one/OFL.txt
  fonts:
    - family: Lilita One
      fonts:
        - asset: assets/fonts/lilita_one/LilitaOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/nunito/Nunito-Black.ttf
          weight: 900
    - family: Black Ops One
      fonts:
        - asset: assets/fonts/black_ops_one/BlackOpsOne-Regular.ttf
